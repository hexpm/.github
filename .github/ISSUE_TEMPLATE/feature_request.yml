name: Feature Request
description: Suggest a new capability or improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please focus on the workflow or user problem first.
  - type: dropdown
    id: component
    attributes:
      label: Product or component
      description: Which product or component would this improve?
      options:
        - "hexpm/hexpm: Website, API server, HexDocs hosting/processing, package preview, and package version diff"
        - "hexpm/hex: Package manager client CLI and Mix task integration for Erlang/Elixir"
        - "hexpm/bob: Automated build service for Elixir, Erlang, Docker tags, and package artifacts"
        - Infrastructure
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the solution you would like to see.
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: Why is this useful?
      description: Explain the benefit to Hex users or maintainers.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any other approaches you considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, references, implementation ideas, or screenshots.
